defaults:
  - _self_
  - task: pusht_image
name: train_priming_image
_target_: diffusion_policy.workspace.train_priming_image_workspace.TrainPrimingImageWorkspace
shape_meta: ${task.shape_meta}
horizon: 16
n_obs_steps: 2
n_action_steps: 8
past_action_visible: false
policy:
  _target_: diffusion_policy.policy.priming_unet_image_policy.PrimingUnetImagePolicy
  shape_meta: ${shape_meta}
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: null
    random_crop: false
    use_group_norm: true
    share_rgb_model: false
    imagenet_norm: true
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  stage: pretrain
  noise_level: 0.8
  samples_per_condition: 4
  distribution_objective: ot
  distribution_window: full
  ot_epsilon: 0.05
  ot_iterations: 30
  delta_weight: 0.0
  clip_sample: true
  diffusion_step_embed_dim: 256
  down_dims: [256,512,1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true
val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  betas: [0.95,0.999]
  eps: 1e-8
  weight_decay: 1e-6
training:
  device: "cuda:0"
  seed: 42
  debug: false
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 400
  gradient_accumulate_every: 1
  use_ema: true
  freeze_encoder: false
  rollout_every: 25
  checkpoint_every: 25
  val_every: 10
  sample_every: 25
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: priming_pusht_image
  resume: false
  mode: disabled
  name: priming_pusht_image
  tags: [priming,image]
  id: null
  group: priming_image
  job_type: pretrain
checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false
hydra:
  run:
    dir: data/outputs/priming_pusht/image_pretrain
